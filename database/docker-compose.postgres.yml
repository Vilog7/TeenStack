version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teenstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teenstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teenstack_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-teenstack}
    ports:
      - '5432:5432'
    volumes:
      - teenstack_pgdata:/var/lib/postgresql/data
      - ./postgresql/001_teenstack_complete_schema.sql:/docker-entrypoint-initdb.d/001_teenstack_complete_schema.sql:ro
      - ./postgresql/002_triggers_and_views.sql:/docker-entrypoint-initdb.d/002_triggers_and_views.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-teenstack} -d $${POSTGRES_DB:-teenstack}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teenstack_pgdata:
